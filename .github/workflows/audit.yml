name: audit

on:
  push:
    branches: [main]
  pull_request:

jobs:
  audit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tap this checkout
        run: |
          mkdir -p "$(brew --repository)/Library/Taps/e-dream-ai"
          ln -s "$GITHUB_WORKSPACE" "$(brew --repository)/Library/Taps/e-dream-ai/homebrew-tap"
      - run: brew trust --cask e-dream-ai/tap/infinidream
      - run: brew style e-dream-ai/tap/infinidream
      - run: brew audit --cask --strict --online e-dream-ai/tap/infinidream
